<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>netlist-simulate</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #202020;
    }

    canvas {
      margin-right: auto;
      margin-left: auto;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .centered {
      margin-right: auto;
      margin-left: auto;
      display: block;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #f0f0f0;
      font-size: 24px;
      font-family: Ubuntu-Light, Helvetica, sans-serif;
      text-align: center;
    }

    /* hide canvas until it's ready */
    canvas:not([data-loaded]) {
      display: none;
    }
  </style>

  <link data-trunk rel="rust" data-wasm-opt="0" />
  <base data-trunk-public-url />

  <link rel="icon" href="data:,">
</head>

<body>
  <canvas id="netlist_simulate"></canvas>

  <div class="centered" id="loading_text">
    <p style="font-size: 16px">Loading…</p>
  </div>
</body>

</html>
