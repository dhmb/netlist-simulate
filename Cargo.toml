[package]
name = "netlist-simulate"
version = "0.1.0"
edition = "2024"

[dependencies]
batsat = { version = "0.6", default-features = false }
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
egui-snarl = { version = "0.12", features = ["serde"] }
egui_icons = "0.0.1"
gds21 = "0.2"
rfd = "0.17.2"
serde = "1.0.229"
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde", "js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }

[profile.dev]
opt-level = 3
debug = true

[profile.dev.package."*"]
opt-level = 3
